<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diep.io Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#cdcdcd;font-family:'Segoe UI',sans-serif;user-select:none}
canvas{display:block;cursor:crosshair}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;z-index:10}
#SS{background:linear-gradient(135deg,#d4d4d4,#e8e8e8,#d0d0d0)}
#SS h1{font-size:55px;color:#3a3a3a;margin-bottom:0;font-weight:800;
text-shadow:0 2px 0 rgba(0,0,0,.08)}
.dot{color:#00b2e1}
.sub{color:#888;font-size:12px;margin-bottom:20px}
.inp{padding:10px 20px;font-size:16px;border:2px solid #c0c0c0;border-radius:8px;
width:300px;text-align:center;outline:none;margin-bottom:10px;background:#fff;transition:.2s;color:#333}
.inp:focus{border-color:#00b2e1;box-shadow:0 0 0 3px rgba(0,178,225,.15)}
.inp::placeholder{color:#aaa}
.bt{padding:13px 55px;font-size:18px;border:none;border-radius:10px;cursor:pointer;
font-weight:700;transition:.2s;background:linear-gradient(135deg,#00b2e1,#0099c4);
color:#fff;box-shadow:0 4px 16px rgba(0,178,225,.35);margin-top:10px}
.bt:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,178,225,.45)}
.online-badge{background:rgba(46,213,115,.2);color:#2ed573;padding:5px 15px;
border-radius:20px;font-size:12px;font-weight:600;margin-bottom:15px;
border:1px solid rgba(46,213,115,.3)}
.room-info{color:#999;font-size:11px;margin-top:8px}
.status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
background:rgba(0,0,0,.5);color:#fff;padding:6px 16px;border-radius:20px;
font-size:12px;z-index:20;display:none}
.status.show{display:block}
.ct{color:#999;font-size:10px;margin-top:14px;text-align:center;line-height:2;max-width:400px}
.ct kbd{background:#e8e8e8;padding:1px 5px;border-radius:3px;font-size:9px;border:1px solid #ccc}
#playerCount{position:fixed;top:10px;right:15px;background:rgba(0,0,0,.3);
color:#fff;padding:5px 12px;border-radius:15px;font-size:11px;z-index:20}
</style>
</head>
<body>
<div class="ov" id="SS">
<h1>⬡ Diep<span class="dot">.</span>io</h1>
<div class="sub">ONLINE MULTIPLAYER</div>
<div class="online-badge">🟢 Online — Jogue com Amigos</div>
<input class="inp" id="nameInp" placeholder="Seu nome..." maxlength="15" autocomplete="off" spellcheck="false">
<input class="inp" id="roomInp" placeholder="Sala (vazio = pública)" maxlength="20" autocomplete="off" spellcheck="false">
<div class="room-info">Compartilhe o nome da sala com amigos para jogar juntos!</div>
<button class="bt" id="playBtn">JOGAR</button>
<div class="ct">
<kbd>WASD</kbd> Mover · <kbd>Mouse</kbd> Mirar · <kbd>Click</kbd> Atirar ·
<kbd>E</kbd> Auto-fire · <kbd>1</kbd>-<kbd>8</kbd> Stats
</div>
</div>
<div class="status" id="status">Conectando...</div>
<div id="playerCount" style="display:none">👥 0</div>
<canvas id="c"></canvas>

<!-- Socket.io CDN -->
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script>
// ============================
//  CONFIG — CHANGE THIS URL!
// ============================
const SERVER_URL = 'http://localhost:3000';
// After deploying to Railway, change to:
// const SERVER_URL = 'https://your-app.railway.app';

const C=document.getElementById('c'),X=C.getContext('2d');
const PI=Math.PI,P2=PI*2,cos=Math.cos,sin=Math.sin,atan2=Math.atan2,
hyp=Math.hypot,abs=Math.abs,Mx=Math.max,Mn=Math.min,fl=Math.floor;
let W,H;function rz(){W=C.width=innerWidth;H=C.height=innerHeight}
window.addEventListener('resize',rz);rz();

const MAP=5200,HF=MAP/2,CELL=24;
const COL={p:'#00b2e1',pD:'#0088ab',e:'#f14e54',eD:'#b7383d',
b:'#999',bD:'#727272',sq:'#ffe869',sqD:'#c7b94e',tr:'#fc7677',trD:'#c75c5c',
pn:'#768dfc',pnD:'#5a6dca',cr:'#f177dd',crD:'#b85aab',
hp:'#85e37d',hpB:'#555',trap:'#f0e060',trapD:'#b0a030',grid:'#c5c5c5',bg:'#cdcdcd'};

const SHAPE_COLS={sq:{c:COL.sq,d:COL.sqD},tr:{c:COL.tr,d:COL.trD},
pn:{c:COL.pn,d:COL.pnD},cr:{c:'#f177dd',d:'#b85aab'}};

// ===== STATE =====
let socket=null,myId=null,playing=0;
let gameState={players:[],shapes:[],bullets:[],me:null,lb:[]};
let cam={x:0,y:0},ms={x:W/2,y:H/2,d:0},keys={},aFire=0;
let fr=0,lastInputSend=0;

// Interpolation targets
let interpPlayers=new Map(); // id -> {x,y,a,tx,ty,ta}

// ===== HELPERS =====
function w2s(wx,wy){return{x:(wx-cam.x)+W/2,y:(wy-cam.y)+H/2}}
function s2w(sx,sy){return{x:sx-W/2+cam.x,y:sy-H/2+cam.y}}
function onS(wx,wy,m=120){const s=w2s(wx,wy);return s.x>-m&&s.x<W+m&&s.y>-m&&s.y<H+m}

function rR(x,y,w,h,r){X.beginPath();
if(X.roundRect)X.roundRect(x,y,w,h,r);
else{X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);
X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);
X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath()}}

// ===== NETWORKING =====
function connect(){
    const statusEl=document.getElementById('status');
    statusEl.className='status show';statusEl.textContent='Conectando...';

    socket=io(SERVER_URL,{transports:['websocket','polling'],reconnection:true,
        reconnectionAttempts:10,reconnectionDelay:1000});

    socket.on('connect',()=>{
        statusEl.textContent='✅ Conectado!';
        setTimeout(()=>statusEl.className='status',2000);
    });

    socket.on('disconnect',()=>{
        statusEl.className='status show';statusEl.textContent='❌ Desconectado — reconectando...';
    });

    socket.on('joined',(data)=>{
        myId=data.id;playing=1;
        document.getElementById('SS').style.display='none';
        document.getElementById('playerCount').style.display='block';
        console.log(`Joined room: ${data.room}`);
    });

    socket.on('playerCount',(count)=>{
        document.getElementById('playerCount').textContent=`👥 ${count} online`;
    });

    socket.on('state',(state)=>{
        gameState=state;

        // Update interpolation targets
        for(const p of state.players){
            if(!interpPlayers.has(p.id)){
                interpPlayers.set(p.id,{x:p.x,y:p.y,a:p.a,tx:p.x,ty:p.y,ta:p.a,...p});
            }else{
                const ip=interpPlayers.get(p.id);
                ip.tx=p.x;ip.ty=p.y;ip.ta=p.a;
                Object.assign(ip,p); // Update other fields
            }
        }
        // Remove disconnected players
        const ids=new Set(state.players.map(p=>p.id));
        for(const [id] of interpPlayers){if(!ids.has(id))interpPlayers.delete(id)}
    });
}

function sendInput(){
    if(!socket||!playing)return;
    const now=Date.now();
    if(now-lastInputSend<33)return; // ~30fps input
    lastInputSend=now;

    let ix=0,iy=0;
    if(keys.w||keys.arrowup)iy-=1;
    if(keys.s||keys.arrowdown)iy+=1;
    if(keys.a||keys.arrowleft)ix-=1;
    if(keys.d||keys.arrowright)ix+=1;
    if(ix&&iy){const l=hyp(ix,iy);ix/=l;iy/=l}

    const wm=s2w(ms.x,ms.y);
    const me=gameState.me;
    const angle=me?atan2(wm.y-me.y,wm.x-me.x):0;

    socket.emit('input',{ix,iy,a:+(angle.toFixed(2)),sh:ms.d||aFire?1:0});
}

// ===== DRAWING =====
function dGrid(){const ox=cam.x%CELL,oy=cam.y%CELL;
X.strokeStyle=COL.grid;X.lineWidth=1;X.globalAlpha=.45;X.beginPath();
for(let x=-ox-CELL;x<W+CELL;x+=CELL){X.moveTo(x,0);X.lineTo(x,H)}
for(let y=-oy-CELL;y<H+CELL;y+=CELL){X.moveTo(0,y);X.lineTo(W,y)}
X.stroke();X.globalAlpha=1}

function dBorder(){const tl=w2s(-HF,-HF),br=w2s(HF,HF);
X.strokeStyle='rgba(100,100,100,.5)';X.lineWidth=4;
X.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
X.fillStyle='rgba(0,0,0,.08)';
if(tl.y>0)X.fillRect(0,0,W,tl.y);if(br.y<H)X.fillRect(0,br.y,W,H-br.y);
if(tl.x>0)X.fillRect(0,tl.y,tl.x,br.y-tl.y);
if(br.x<W)X.fillRect(br.x,tl.y,W-br.x,br.y-tl.y)}

function dShape(s){
if(!onS(s.x,s.y,s.r+20))return;
const sc=w2s(s.x,s.y);
const cols=SHAPE_COLS[s.tp]||SHAPE_COLS.sq;
X.save();X.translate(sc.x,sc.y);X.rotate(s.a||0);
X.strokeStyle=cols.d;X.fillStyle=cols.c;X.lineWidth=3;
X.beginPath();
switch(s.tp){
case'sq':X.rect(-s.r*.85,-s.r*.85,s.r*1.7,s.r*1.7);break;
case'tr':case'cr':for(let i=0;i<3;i++){const a=P2/3*i-PI/2;
i?X.lineTo(cos(a)*s.r,sin(a)*s.r):X.moveTo(cos(a)*s.r,sin(a)*s.r)}X.closePath();break;
case'pn':for(let i=0;i<5;i++){const a=P2/5*i-PI/2;
i?X.lineTo(cos(a)*s.r,sin(a)*s.r):X.moveTo(cos(a)*s.r,sin(a)*s.r)}X.closePath();break;
}
X.fill();X.stroke();X.restore();
if(s.hp<s.mhp)dHP(sc.x,sc.y+s.r+8,Mx(25,s.r*1.2),4,Mx(0,s.hp/s.mhp))}

function dPlayer(p){
if(!p.alive||!onS(p.x,p.y,80))return;
const sc=w2s(p.x,p.y);
const isMe=p.id===myId;
const col=isMe?COL.p:COL.e;
const colD=isMe?COL.pD:COL.eD;

X.save();X.translate(sc.x,sc.y);X.rotate(p.a||0);
// Barrel
X.fillStyle=COL.b;X.strokeStyle=COL.bD;X.lineWidth=2.5;
X.fillRect(-4,-10.5,p.r+28,21);X.strokeRect(-4,-10.5,p.r+28,21);
// Body
X.beginPath();X.arc(0,0,p.r||24,0,P2);
X.fillStyle=col;X.strokeStyle=colD;X.lineWidth=3;X.fill();X.stroke();
if(p.inv){X.beginPath();X.arc(0,0,(p.r||24)+5,0,P2);
X.strokeStyle='rgba(100,200,255,.3)';X.lineWidth=2;X.stroke()}
X.restore();

// Name
X.textAlign='center';X.font='bold 12px Segoe UI';
X.fillStyle='#fff';X.strokeStyle='rgba(0,0,0,.35)';X.lineWidth=3;
X.strokeText(p.nm,sc.x,sc.y-(p.r||24)-18);
X.fillText(p.nm,sc.x,sc.y-(p.r||24)-18);
X.font='bold 9px Segoe UI';X.fillStyle='rgba(255,255,255,.7)';
const clsName=p.cls||'basic';
X.strokeText(`Lv${p.lv} ${clsName}`,sc.x,sc.y-(p.r||24)-7);
X.fillText(`Lv${p.lv} ${clsName}`,sc.x,sc.y-(p.r||24)-7);

// HP bar
if(p.hp<p.mhp)dHP(sc.x,sc.y+(p.r||24)+10,42,5,Mx(0,p.hp/p.mhp));
}

function dBullet(b){
if(!onS(b.x,b.y,20))return;
const sc=w2s(b.x,b.y);
const isMe=b.oid===myId;
X.beginPath();
if(b.tp){// Trap
for(let i=0;i<6;i++){const a=P2/6*i;
i?X.lineTo(sc.x+cos(a)*b.r,sc.y+sin(a)*b.r):X.moveTo(sc.x+cos(a)*b.r,sc.y+sin(a)*b.r)}
X.closePath();X.fillStyle=COL.trap;X.strokeStyle=COL.trapD;
}else{
X.arc(sc.x,sc.y,b.r,0,P2);
X.fillStyle=isMe?COL.p:COL.e;X.strokeStyle=isMe?COL.pD:COL.eD;
}
X.lineWidth=2;X.fill();X.stroke()}

function dHP(x,y,w,h,p){p=Mx(0,Mn(1,p));
X.fillStyle='rgba(0,0,0,.22)';rR(x-w/2-1,y-1,w+2,h+2,h/2);X.fill();
X.fillStyle=p>.3?COL.hp:'#ff4757';rR(x-w/2,y,w*p,h,h/2);X.fill()}

// ===== UI =====
const SN=['HP Regen','HP Máx','Dano Corpo','Vel. Bala','Penetração','Dano Bala','Recarga','Vel. Mov.'];
const SC2=['#fcad67','#f04f78','#9566c9','#6093e0','#6093e0','#6093e0','#66c58e','#66c58e'];

function dStats(){
const me=gameState.me;if(!me||!me.alive)return;
const px=16,py=H-245,bw=200,bh=20,gap=26;
X.fillStyle='rgba(0,0,0,.12)';rR(px-8,py-34,bw+40,gap*8+50,10);X.fill();
X.font='bold 13px Segoe UI';X.textAlign='left';
X.fillStyle='rgba(255,255,255,.85)';X.fillText(`Lv ${me.lv} ${me.cls}`,px,py-18);
if(me.sp>0){X.fillStyle='#ffd700';X.font='bold 12px Segoe UI';X.fillText(`+${me.sp}`,px+bw-10,py-18)}
for(let i=0;i<8;i++){const yy=py+i*gap,val=me.st[i];
X.fillStyle='rgba(0,0,0,.15)';rR(px,yy,bw,bh,bh/2);X.fill();
if(val>0){X.fillStyle=SC2[i];X.globalAlpha=.8;
rR(px,yy,bw*Mn(1,val/7),bh,bh/2);X.fill();X.globalAlpha=1}
X.fillStyle='rgba(255,255,255,.9)';X.font='bold 10px Segoe UI';X.textAlign='left';
X.fillText(`${i+1} ${SN[i]}`,px+8,yy+14);X.textAlign='right';X.fillText(`${val}`,px+bw-8,yy+14);
if(me.sp>0&&val<7){X.fillStyle='rgba(46,213,115,.4)';rR(px+bw+6,yy,22,bh,bh/2);X.fill();
X.fillStyle='#2ed573';X.font='bold 15px Segoe UI';X.textAlign='center';
X.fillText('+',px+bw+17,yy+15)}}X.textAlign='left'}

function dXP(){
const me=gameState.me;if(!me||!me.alive)return;
const bw=W*.38,bh=22,x=W/2-bw/2,y=H-40;
const pct=me.lv>=45?1:(me.xpNext>0?me.xp/me.xpNext:0);
X.fillStyle='rgba(0,0,0,.18)';rR(x-1,y-1,bw+2,bh+2,bh/2+1);X.fill();
if(pct>0){const grd=X.createLinearGradient(x,y,x+bw*pct,y);
grd.addColorStop(0,'#ffa502');grd.addColorStop(1,'#ffd700');
X.fillStyle=grd;rR(x,y,bw*pct,bh,bh/2);X.fill()}
X.fillStyle='rgba(255,255,255,.9)';X.font='bold 11px Segoe UI';X.textAlign='center';
X.fillText(`Level ${me.lv} — ${me.cls}`,W/2,y+15)}

function dSc(){
const me=gameState.me;if(!me)return;
X.textAlign='center';X.font='bold 20px Segoe UI';
X.fillStyle='rgba(255,255,255,.8)';X.strokeStyle='rgba(0,0,0,.15)';X.lineWidth=3;
X.strokeText(me.sc.toLocaleString(),W/2,30);X.fillText(me.sc.toLocaleString(),W/2,30)}

function dLB(){
const lb=gameState.lb||[];if(!lb.length)return;
const lx=W-185,ly=10;const maxS=lb[0]?lb[0].sc:1;
X.fillStyle='rgba(0,0,0,.15)';rR(lx-8,ly,190,28+lb.length*24,8);X.fill();
X.fillStyle='rgba(255,255,255,.8)';X.font='bold 13px Segoe UI';X.textAlign='center';
X.fillText('Leaderboard',lx+87,ly+18);
lb.forEach((t,i)=>{const yy=ly+32+i*24;const pct=maxS>0?t.sc/maxS:0;
X.fillStyle='rgba(0,178,225,.15)';rR(lx-2,yy-2,170*pct,18,4);X.fill();
X.fillStyle='rgba(255,255,255,.8)';X.font='11px Segoe UI';X.textAlign='left';
const md=i<3?['🥇','🥈','🥉'][i]:`${i+1}.`;
X.fillText(`${md} ${t.nm}`,lx,yy+11);X.textAlign='right';
X.fillStyle='rgba(255,255,255,.5)';X.fillText(t.sc.toLocaleString(),lx+172,yy+11)})}

function dMinimap(){
const me=gameState.me;
const mw=130,mh=130,mx=W-mw-14,my=H-mh-14,sc=mw/MAP;
X.fillStyle='rgba(200,200,200,.45)';X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1;
rR(mx,my,mw,mh,6);X.fill();rR(mx,my,mw,mh,6);X.stroke();
// Players
for(const p of gameState.players){if(!p.alive)continue;
X.fillStyle=p.id===myId?COL.p:COL.e;
X.beginPath();X.arc(mx+(p.x+HF)*sc,my+(p.y+HF)*sc,p.id===myId?3:2,0,P2);X.fill()}
}

function dInd(){
X.font='bold 10px Segoe UI';X.textAlign='left';
if(aFire){X.fillStyle='rgba(255,200,0,.7)';X.fillText('⚡ Auto-Fire [E]',16,52)}
}

// ===== STAT CLICK =====
function hSC(x,y){
const me=gameState.me;if(!me||me.sp<=0)return;
const px=16,py=H-245,gap=26,bw=200,bh=20;
for(let i=0;i<8;i++){const yy=py+i*gap;
if(x>=px+bw+6&&x<=px+bw+28&&y>=yy&&y<=yy+bh){
if(me.st[i]<7){socket.emit('upgradeStat',i);return}}}}

// ===== MAIN LOOP =====
function loop(){
requestAnimationFrame(loop);
if(!playing)return;
fr++;

// Send input to server
sendInput();

// Interpolate player positions
for(const [id,ip] of interpPlayers){
    ip.x+=(ip.tx-ip.x)*.15;
    ip.y+=(ip.ty-ip.y)*.15;
    // Angle interpolation
    let da=ip.ta-ip.a;
    while(da>PI)da-=P2;while(da<-PI)da+=P2;
    ip.a+=da*.15;
}

// Camera follows my player
const me=gameState.me;
if(me&&me.alive){
    const myInterp=interpPlayers.get(myId);
    if(myInterp){
        cam.x+=(myInterp.x-cam.x)*.12;
        cam.y+=(myInterp.y-cam.y)*.12;
    }
}

// ===== RENDER =====
X.fillStyle=COL.bg;X.fillRect(0,0,W,H);
dGrid();dBorder();

// Shapes
if(gameState.shapes){
    gameState.shapes.sort((a,b)=>a.y-b.y).forEach(dShape)}

// Bullets
if(gameState.bullets){
    gameState.bullets.forEach(dBullet)}

// Players (interpolated)
const sortedPlayers=[...interpPlayers.values()].filter(p=>p.alive).sort((a,b)=>a.y-b.y);
sortedPlayers.forEach(dPlayer);

// UI
dStats();dXP();dSc();dLB();dMinimap();dInd();
}

// ===== INPUT =====
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=1;
if(e.key===' '){e.preventDefault();ms.d=1}
if(e.key.toLowerCase()==='e')aFire=!aFire;
const num=parseInt(e.key);
if(num>=1&&num<=8&&socket)socket.emit('upgradeStat',num-1);
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;
if(e.key===' ')ms.d=0});
C.addEventListener('mousemove',e=>{ms.x=e.clientX;ms.y=e.clientY});
C.addEventListener('mousedown',e=>{ms.d=1;hSC(e.clientX,e.clientY)});
C.addEventListener('mouseup',()=>ms.d=0);
C.addEventListener('contextmenu',e=>e.preventDefault());

// ===== START =====
document.getElementById('playBtn').addEventListener('click',()=>{
    const name=document.getElementById('nameInp').value.trim()||'Jogador';
    const room=document.getElementById('roomInp').value.trim()||'public';
    connect();
    socket.on('connect',()=>{
        socket.emit('join',{name,room});
    });
});
document.getElementById('nameInp').addEventListener('keydown',e=>{
    if(e.key==='Enter')document.getElementById('playBtn').click()});

requestAnimationFrame(loop);
</script>
</body>
</html>
