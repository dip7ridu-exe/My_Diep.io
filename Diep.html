                            <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diep.io Ultimate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#cdcdcd;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none}
canvas{display:block;cursor:crosshair}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;z-index:10;transition:opacity .4s}
#SS{background:linear-gradient(135deg,#d4d4d4 0%,#e8e8e8 50%,#d0d0d0 100%)}
#DS{background:rgba(10,10,20,.72);backdrop-filter:blur(6px);display:none}
#SS h1{font-size:58px;color:#3a3a3a;margin-bottom:0;letter-spacing:-1px;font-weight:800;
text-shadow:0 2px 0 rgba(0,0,0,.08)}
#SS .dot{color:#00b2e1}
.sub{color:#888;font-size:12px;margin-bottom:24px;letter-spacing:.5px}
#NI{padding:11px 22px;font-size:17px;border:2px solid #c0c0c0;border-radius:8px;
width:300px;text-align:center;outline:none;margin-bottom:14px;background:#fff;transition:all .25s;color:#333}
#NI::placeholder{color:#aaa}
#NI:focus{border-color:#00b2e1;box-shadow:0 0 0 3px rgba(0,178,225,.15)}
.ms{display:flex;gap:8px;margin-bottom:18px}
.mb{padding:9px 22px;font-size:13px;border:2px solid #bbb;border-radius:8px;
cursor:pointer;background:#fff;color:#666;font-weight:600;transition:all .2s;letter-spacing:.3px}
.mb:hover{border-color:#00b2e1;color:#00b2e1;background:#f0faff;transform:translateY(-1px)}
.mb.ac{background:linear-gradient(135deg,#00b2e1,#0099c4);color:#fff;
border-color:transparent;box-shadow:0 3px 12px rgba(0,178,225,.35)}
.bt{padding:14px 60px;font-size:19px;border:none;border-radius:10px;cursor:pointer;
font-weight:700;letter-spacing:1px;transition:all .2s;
background:linear-gradient(135deg,#00b2e1,#0099c4);color:#fff;
box-shadow:0 4px 16px rgba(0,178,225,.35)}
.bt:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,178,225,.45)}
.bt:active{transform:translateY(0)}
.ct{color:#999;font-size:10.5px;margin-top:20px;text-align:center;line-height:2.2;max-width:520px}
.ct kbd{background:#e8e8e8;padding:1px 6px;border-radius:3px;font-size:10px;
border:1px solid #ccc;font-family:inherit}
#DS h2{color:#ff4757;font-size:36px;margin-bottom:6px;font-weight:800;
text-shadow:0 2px 12px rgba(255,71,87,.3)}
#DS p{color:rgba(255,255,255,.8);font-size:15px;margin:3px 0}
.ds{display:flex;gap:32px;margin:16px 0;flex-wrap:wrap;justify-content:center}
.di{text-align:center;color:rgba(255,255,255,.6);font-size:12px;letter-spacing:.5px}
.di span{display:block;color:#ffd700;font-size:28px;font-weight:800;margin-bottom:2px}
#RB{margin-top:20px}
</style>
</head>
<body>
<div class="ov" id="SS">
<h1>⬡ Diep<span class="dot">.</span>io</h1>
<div class="sub">ULTIMATE — 38 Classes • Drones • Trappers • Smashers</div>
<input type="text" id="NI" placeholder="Digite seu nome..." maxlength="15" autocomplete="off" spellcheck="false">
<div class="ms">
<button class="mb ac" data-mode="ffa">⚔️ FFA</button>
<button class="mb" data-mode="sandbox">🧪 Sandbox</button>
<button class="mb" data-mode="survival">💀 Survival</button>
</div>
<button class="bt" id="PB">JOGAR</button>
<div class="ct">
<kbd>WASD</kbd> Mover · <kbd>Mouse</kbd> Mirar · <kbd>Click</kbd>/<kbd>Espaço</kbd> Atirar ·
<kbd>E</kbd> Auto-fire · <kbd>C</kbd> Auto-spin<br>
<kbd>1</kbd>-<kbd>8</kbd> Stats · <kbd>Shift</kbd> Boost ·
<kbd>Tab</kbd> Score · <kbd>K</kbd> LvlUp · <kbd>O</kbd> Suicídio ·
<kbd>R</kbd> Reset · <kbd>M</kbd> MaxAll (Sandbox)
</div>
</div>
<div class="ov" id="DS">
<h2>DESTRUÍDO</h2>
<p id="KB"></p>
<div class="ds">
<div class="di"><span id="dS">0</span>PONTOS</div>
<div class="di"><span id="dL">0</span>NÍVEL</div>
<div class="di"><span id="dK">0</span>ABATES</div>
<div class="di"><span id="dT">0:00</span>TEMPO</div>
</div>
<button class="bt" id="RB">JOGAR NOVAMENTE</button>
</div>
<canvas id="c"></canvas>
<script>
// ==================== ENGINE ====================
const C=document.getElementById('c'),X=C.getContext('2d');
const PI=Math.PI,P2=PI*2,cos=Math.cos,sin=Math.sin,atan2=Math.atan2,
hyp=Math.hypot,abs=Math.abs,Mx=Math.max,Mn=Math.min,fl=Math.floor,
cl=Math.ceil,R=Math.random;
let W,H;function rz(){W=C.width=innerWidth;H=C.height=innerHeight}
window.addEventListener('resize',rz);rz();

const MAP=5200,HF=MAP/2,CELL=24;
const COL={p:'#00b2e1',pD:'#0088ab',e:'#f14e54',eD:'#b7383d',
b:'#999',bD:'#727272',sq:'#ffe869',sqD:'#c7b94e',tr:'#fc7677',trD:'#c75c5c',
pn:'#768dfc',pnD:'#5a6dca',cr:'#f177dd',crD:'#b85aab',gn:'#89ff69',gnD:'#5cc740',
hp:'#85e37d',hpB:'#555',trap:'#f0e060',trapD:'#b0a030',grid:'#c5c5c5',bg:'#cdcdcd'};

// ==================== CLASSES ====================
const CLS={
basic:{n:'Basic',t:0,fire:'all',c:[{a:0,w:21,l:28}],r:1,bs:1,bz:1},
twin:{n:'Twin',t:1,fire:'seq',c:[{a:0,w:17,l:26,o:-11},{a:0,w:17,l:26,o:11}],r:.55,bz:.8},
sniper:{n:'Sniper',t:1,fire:'all',c:[{a:0,w:19,l:40}],r:1.5,bs:1.4,bz:.9,fov:1.2},
mg:{n:'Machine Gun',t:1,fire:'all',c:[{a:0,w:14,l:26,we:26}],r:.4,bs:.9,bz:.7,sp:.2},
flank:{n:'Flank Guard',t:1,fire:'all',c:[{a:0,w:20,l:26},{a:PI,w:17,l:22}],r:.85,bz:.9},
tripleShot:{n:'Triple Shot',t:2,fire:'all',c:[{a:0,w:20,l:26},{a:-.38,w:17,l:24},{a:.38,w:17,l:24}],r:.8,bz:.8},
quad:{n:'Quad Tank',t:2,fire:'all',c:[0,PI/2,PI,-PI/2].map(a=>({a,w:20,l:26})),r:.85,bz:.85},
assassin:{n:'Assassin',t:2,fire:'all',c:[{a:0,w:18,l:48}],r:1.8,bs:1.6,bz:.85,fov:1.35},
hunter:{n:'Hunter',t:2,fire:'seq',c:[{a:0,w:23,l:34},{a:0,w:14,l:44}],r:1.2,bs:1.3,fov:1.1},
overseer:{n:'Overseer',t:2,fire:'all',c:[{a:PI/2,w:24,l:16,dr:1},{a:-PI/2,w:24,l:16,dr:1}],r:2.5,bs:.4,bz:1.3,md:8},
trapper:{n:'Trapper',t:2,fire:'all',c:[{a:0,w:17,l:28,tp:1}],r:1.8,bs:.3,bz:1.5},
destroyer:{n:'Destroyer',t:2,fire:'all',c:[{a:0,w:32,l:28}],r:3,bs:.7,bz:2.2},
gunner:{n:'Gunner',t:2,fire:'seq',c:[{a:0,w:10,l:30,o:-12},{a:0,w:10,l:26,o:-4},{a:0,w:10,l:26,o:4},{a:0,w:10,l:30,o:12}],r:.3,bs:1.15,bz:.5},
triAngle:{n:'Tri-Angle',t:2,fire:'all',c:[{a:0,w:20,l:26},{a:PI-.35,w:14,l:20,th:1},{a:PI+.35,w:14,l:20,th:1}],r:.85,spd:1.3},
auto3:{n:'Auto 3',t:2,fire:'all',autoT:3,c:[],r:1,bz:.7},
smasher:{n:'Smasher',t:2,fire:'all',smash:1,c:[],r:1,body:1.15,extraSP:4},
sprayer:{n:'Sprayer',t:2,fire:'seq',c:[{a:0,w:21,l:28},{a:0,w:13,l:38}],r:.3,bz:.55,sp:.16},
hex:{n:'Hex Tank',t:2,fire:'all',c:[0,1,2,3,4,5].map(i=>({a:i*PI/3,w:17,l:22})),r:.9,bz:.75},
triplet:{n:'Triplet',t:3,fire:'seq',c:[{a:0,w:17,l:30,o:-10},{a:0,w:17,l:26},{a:0,w:17,l:30,o:10}],r:.4,bz:.75},
pentaShot:{n:'Penta Shot',t:3,fire:'all',c:[{a:0,w:20,l:26},{a:-.36,w:17,l:24},{a:.36,w:17,l:24},{a:-.7,w:15,l:22},{a:.7,w:15,l:22}],r:.7,bz:.7},
spreadShot:{n:'Spread Shot',t:3,fire:'all',c:Array.from({length:11},(_,i)=>{const a=(i-5)*.19;return{a,w:8+abs(5-i)*1.3,l:16+abs(5-i)*2}}),r:.8,bz:.4,bs:.85},
ranger:{n:'Ranger',t:3,fire:'all',c:[{a:0,w:16,l:58}],r:2,bs:1.8,bz:.75,fov:1.55},
stalker:{n:'Stalker',t:3,fire:'all',c:[{a:0,w:18,l:48}],r:1.8,bs:1.6,bz:.8,fov:1.4,st:1},
overlord:{n:'Overlord',t:3,fire:'all',c:[0,PI/2,PI,-PI/2].map(a=>({a,w:24,l:16,dr:1})),r:1.5,bs:.4,bz:1.3,md:12},
manager:{n:'Manager',t:3,fire:'all',st:1,c:[{a:0,w:24,l:16,dr:1}],r:2.5,bs:.4,bz:1.4,md:8},
necromancer:{n:'Necromancer',t:3,fire:'all',c:[{a:PI/2,w:26,l:16,dr:1},{a:-PI/2,w:26,l:16,dr:1}],r:3,bs:.3,bz:1,md:20,necro:1},
battleship:{n:'Battleship',t:3,fire:'seq',c:[{a:PI/2,w:14,l:14,dr:1,o:-10},{a:PI/2,w:14,l:14,dr:1,o:10},{a:-PI/2,w:14,l:14,dr:1,o:-10},{a:-PI/2,w:14,l:14,dr:1,o:10}],r:.35,bs:.6,bz:.6,md:24},
predator:{n:'Predator',t:3,fire:'seq',c:[{a:0,w:24,l:36},{a:0,w:18,l:42},{a:0,w:12,l:48}],r:1.4,bs:1.3,fov:1.3},
streamliner:{n:'Streamliner',t:3,fire:'all',c:[{a:0,w:13,l:50}],r:.2,bs:1.5,bz:.4,fov:1.15},
annihilator:{n:'Annihilator',t:3,fire:'all',c:[{a:0,w:40,l:32}],r:3.5,bs:.6,bz:3},
hybrid:{n:'Hybrid',t:3,fire:'all',c:[{a:0,w:32,l:28},{a:PI,w:24,l:16,dr:1}],r:3,bs:.7,bz:2.2,md:4},
autoGunner:{n:'Auto Gunner',t:3,fire:'seq',autoT:1,c:[{a:0,w:10,l:30,o:-12},{a:0,w:10,l:26,o:-4},{a:0,w:10,l:26,o:4},{a:0,w:10,l:30,o:12}],r:.3,bs:1.15,bz:.5},
booster:{n:'Booster',t:3,fire:'all',c:[{a:0,w:20,l:26},{a:PI-.48,w:14,l:18,th:1},{a:PI+.48,w:14,l:18,th:1},{a:PI-.14,w:11,l:20,th:1},{a:PI+.14,w:11,l:20,th:1}],r:.85,spd:1.8},
fighter:{n:'Fighter',t:3,fire:'all',c:[{a:0,w:20,l:26},{a:PI/2,w:14,l:20},{a:-PI/2,w:14,l:20},{a:PI-.38,w:13,l:18,th:1},{a:PI+.38,w:13,l:18,th:1}],r:.85,spd:1.4},
auto5:{n:'Auto 5',t:3,fire:'all',autoT:5,c:[],r:1,bz:.65},
octo:{n:'Octo Tank',t:3,fire:'all',c:[0,1,2,3,4,5,6,7].map(i=>({a:i*PI/4,w:17,l:22})),r:.9,bz:.7},
landmine:{n:'Landmine',t:3,fire:'all',smash:1,st:1,c:[],r:1,body:1.15,extraSP:4},
spike:{n:'Spike',t:3,fire:'all',smash:2,c:[],r:1,body:1.2,extraSP:6},
megaTrapper:{n:'Mega Trapper',t:3,fire:'all',c:[{a:0,w:30,l:26,tp:1}],r:3,bs:.2,bz:2.5},
triTrapper:{n:'Tri-Trapper',t:3,fire:'all',c:[{a:0,w:17,l:26,tp:1},{a:P2/3,w:17,l:26,tp:1},{a:-P2/3,w:17,l:26,tp:1}],r:2,bs:.25,bz:1.2}
};

const TREE={
basic:{15:['twin','sniper','mg','flank'],30:['smasher']},
twin:{30:['tripleShot','quad']},sniper:{30:['assassin','overseer','hunter','trapper']},
mg:{30:['destroyer','gunner','sprayer']},flank:{30:['triAngle','auto3','hex']},
tripleShot:{45:['triplet','pentaShot','spreadShot']},quad:{45:['octo']},
assassin:{45:['ranger','stalker']},hunter:{45:['predator','streamliner']},
overseer:{45:['overlord','manager','necromancer','battleship']},
trapper:{45:['megaTrapper','triTrapper']},destroyer:{45:['annihilator','hybrid']},
gunner:{45:['autoGunner']},triAngle:{45:['booster','fighter']},
auto3:{45:['auto5']},smasher:{45:['landmine','spike']}
};

const SN=['HP Regen','HP Máx','Dano Corpo','Vel. Bala','Penetração','Dano Bala','Recarga','Vel. Mov.'];
const SC2=['#fcad67','#f04f78','#9566c9','#6093e0','#6093e0','#6093e0','#66c58e','#66c58e'];
const MS=7;
const BN=['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Ghost','Hunter','Icarus','Jaguar','Knight','Legion','Maverick','Nova','Omega','Phoenix','Raptor','Shadow','Titan','Viper','Wolf','Xenon','Yeti','Zeus','Blaze','Cipher'];

// ==================== STATE ====================
let playing=0,mode='ffa',P=null,ents=[],buls=[],bots=[];
// CAMERA: target + smooth position, separate from player
let cam={tx:0,ty:0,x:0,y:0};
let ms2={x:W/2,y:H/2,d:0},keys={},aFire=0,aSpin=0;
let nots=[],kFeed=[],parts=[];
let shk={x:0,y:0,a:0},fr=0,sTime=0,sWave=0,sTimer=0,showTab=0;
let fps=0,fpsCnt=0,fpsT=0;
let uiXP=0;

// ==================== HELPERS ====================
function dist(a,b){return hyp(a.x-b.x,a.y-b.y)}
function lp(a,b,t){return a+(b-a)*t}
function cll(v,a,b){return Mx(a,Mn(b,v))}
function rr(a,b){return a+R()*(b-a)}
function ri(a,b){return fl(rr(a,b+1))}
function w2s(wx,wy){return{x:(wx-cam.x)+W/2+shk.x,y:(wy-cam.y)+H/2+shk.y}}
function s2w(sx,sy){return{x:sx-W/2+cam.x,y:sy-H/2+cam.y}}
function onS(wx,wy,m=120){const s=w2s(wx,wy);return s.x>-m&&s.x<W+m&&s.y>-m&&s.y<H+m}
function xpF(l){return cl(18*Math.pow(l,1.45))}

// ==================== AUDIO ====================
let ac=null;
function ea(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t='sine',v=.04){
try{ea();const o=ac.createOscillator(),g=ac.createGain();
o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

// ==================== PARTICLES ====================
let pPool=[];
function sP(x,y,c,n=12){for(let i=0;i<n;i++){
const a=R()*P2,s=1+R()*3.5;
pPool.push({x,y,c,vx:cos(a)*s,vy:sin(a)*s,life:1,d:.02+R()*.03,sz:2+R()*4})}}

// ==================== ENTITY CREATION ====================
function mkT(x,y,nm,isP=0){
return{x,y,vx:0,vy:0,a:0,r:24,hp:50,mhp:50,dhp:50,
nm:nm||'Tank',isP,cls:'basic',lv:1,xp:0,sc:0,ki:0,
st:[0,0,0,0,0,0,0,0],sp:0,rT:0,cI:0,alive:1,
col:isP?COL.p:COL.e,colD:isP?COL.pD:COL.eD,
rgT:0,inv:0,stT:0,stA:1,bsT:0,bsCd:0,dC:0,
autoA:[0,0,0,0,0],
aiTg:null,aiT:0,aiW:R()*P2,aiWT:0}}

function mkS(tp,cx,cy){
let s={x:cx??rr(-HF+80,HF-80),y:cy??rr(-HF+80,HF-80),
vx:0,vy:0,a:R()*P2,rot:rr(-.015,.015),alive:1,tp,grn:0,
hp:10,mhp:10,dhp:10,r:14,xp:10,sc:10,col:COL.sq,colD:COL.sqD};
switch(tp){
case'tr':s.r=18;s.hp=s.mhp=s.dhp=30;s.xp=25;s.sc=25;s.col=COL.tr;s.colD=COL.trD;break;
case'pn':s.r=28;s.hp=s.mhp=s.dhp=100;s.xp=130;s.sc=130;s.col=COL.pn;s.colD=COL.pnD;break;
case'al':s.r=72;s.hp=s.mhp=s.dhp=3000;s.xp=s.sc=3000;s.col='#768dfc';s.colD='#4a5dba';s.rot=rr(-.005,.005);break;
case'cr':s.r=12;s.hp=s.mhp=s.dhp=15;s.xp=s.sc=15;s.col=COL.cr;s.colD=COL.crD;s.ho=1;s.spd=2.8;break;}
if(R()<.015&&tp!=='al'&&tp!=='cr'){s.grn=1;s.xp*=10;s.sc*=10;s.hp*=3;s.mhp=s.dhp=s.hp;
s.col=COL.gn;s.colD=COL.gnD}return s}

function mkB(own,x,y,angle,stats,cd,flags={}){
const isDr=flags.dr||0,isTp=flags.tp||0;
const sB=isTp?.5:6.5*(cd.bs||1),spd=isTp?sB:sB*(1+(stats[3]||0)*.14);
const spr=isTp?0:(cd.sp||0)*(R()-.5),a=angle+spr;
let sz=(8*(cd.bz||1))*(1+(stats[3]||0)*.03);
if(isDr)sz*=1.3;if(isTp)sz*=1.5;
return{x,y,vx:cos(a)*spd,vy:sin(a)*spd,r:sz,
hp:isTp?30+(stats[4]||0)*8:6+(stats[4]||0)*3,
dmg:isDr?5+(stats[5]||0)*3:isTp?4+(stats[5]||0)*2:7+(stats[5]||0)*4,
own,life:isDr?450:isTp?600:110,alive:1,isDr,isTp,isSq:0,
col:own&&own.isP?COL.p:COL.e,colD:own&&own.isP?COL.pD:COL.eD,orbA:R()*P2}}

// ==================== STATS ====================
function gMHP(t){return(50*(1+t.st[1]*.2)+t.lv*2)*(CLS[t.cls].smash?1.5:1)}
function gBD(t){return 5*(1+t.st[2]*.25)*(CLS[t.cls].smash?CLS[t.cls].smash===2?3:2:1)}
function gMS(t){let s=3.2*(1+t.st[7]*.11);const cd=CLS[t.cls];
if(cd.spd)s*=1+(cd.spd-1)*.35;if(cd.smash)s*=1.1;if(t.bsT>0)s*=1.45;return s}
function gRg(t){return .08*(1+t.st[0]*.45)}
function gRL(t){return Mx(2,(30*(CLS[t.cls].r||1))/(1+t.st[6]*.15))}

function addXP(t,amt){if(mode==='sandbox')amt*=3;t.xp+=amt;
while(t.lv<45&&t.xp>=xpF(t.lv)){t.xp-=xpF(t.lv);t.lv++;t.sp++;
const cd=CLS[t.cls];if(cd.extraSP&&t.lv===30)t.sp+=cd.extraSP;
t.mhp=gMHP(t);t.hp=t.mhp;t.r=24+t.lv*.35;if(cd.body)t.r*=cd.body;
if(t.isP){nots.push({text:`Nível ${t.lv}!`,t:100,c:'#ffd700'});tn(523,.05);
setTimeout(()=>tn(659,.05),50);setTimeout(()=>tn(784,.08),100)}}}

// ==================== SANDBOX COMMANDS ====================
function sandboxReset(){
if(!P||mode!=='sandbox')return;
// Kill all existing drones/bullets owned by player
buls=buls.filter(b=>{if(b.own===P){return false}return true});
P.cls='basic';P.lv=1;P.xp=0;P.sc=0;P.ki=0;
P.st=[0,0,0,0,0,0,0,0];P.sp=100;
P.r=24;P.mhp=gMHP(P);P.hp=P.dhp=P.mhp;
P.dC=0;P.cI=0;P.rT=0;P.stT=0;P.stA=1;P.bsT=0;P.bsCd=0;
P.inv=60;
nots.push({text:'🔄 Stats Resetados!',t:100,c:'#ff6b6b'});
tn(400,.06,'sawtooth',.04);setTimeout(()=>tn(300,.08,'sawtooth',.03),60);
}

function sandboxMax(){
if(!P||mode!=='sandbox')return;
buls=buls.filter(b=>{if(b.own===P&&b.isDr){return false}return true});
// Max level
while(P.lv<45){P.xp=0;P.lv++;P.sp++;}
P.xp=0;P.sp=0;
// Max all allowed stats

// FIXED: Responsive movement with proper acceleration model
function updP(dt){
if(!P||!P.alive)return;
const spd=gMS(P);
let ix=0,iy=0; // Input direction
if(keys.w||keys.arrowup)iy-=1;
if(keys.s||keys.arrowdown)iy+=1;
if(keys.a||keys.arrowleft)ix-=1;
if(keys.d||keys.arrowright)ix+=1;

// Normalize diagonal
if(ix&&iy){const l=hyp(ix,iy);ix/=l;iy/=l}

// FIXED MOVEMENT: Direct velocity approach for snappy feel
const accel=spd*0.35; // Higher acceleration = snappier
const friction=0.82; // Higher friction = stops faster

if(ix||iy){
    // Accelerate toward input direction
    P.vx+=ix*accel*dt*60;
    P.vy+=iy*accel*dt*60;
}

// Apply friction (always)
const fric=Math.pow(friction,dt*60);
P.vx*=fric;
P.vy*=fric;

// Clamp max speed
const curSpd=hyp(P.vx,P.vy);
const maxSpd=spd*1.1;
if(curSpd>maxSpd){P.vx*=maxSpd/curSpd;P.vy*=maxSpd/curSpd}

// Apply velocity
P.x+=P.vx*dt*60;
P.y+=P.vy*dt*60;

// Map bounds
P.x=cll(P.x,-HF+30,HF-30);
P.y=cll(P.y,-HF+30,HF-30);

// Aim
if(aSpin){P.a+=.04*dt*60}
else{const w=s2w(ms2.x,ms2.y);P.a=atan2(w.y-P.y,w.x-P.x)}

// Shoot
P.rT-=dt*60;
if((ms2.d||aFire)&&P.rT<=0)fireTk(P);
fireAuto(P);

// Regen
P.rgT+=dt*60;
if(P.rgT>80)P.hp=Mn(P.mhp,P.hp+gRg(P)*dt*60);
if(P.inv>0)P.inv-=dt*60;

// Stealth
const cd=CLS[P.cls];
if(cd.st){if(!ix&&!iy&&!ms2.d&&!aFire){P.stT+=dt*60;P.stA=Mx(.06,1-P.stT/90)}
else{P.stT=0;P.stA=1}}else P.stA=1;
if(P.bsT>0)P.bsT-=dt*60;
if(P.bsCd>0)P.bsCd-=dt*60;

// Smooth HP
P.dhp=lp(P.dhp,P.hp,.15);
}

function updCam(dt){

if(cd.smash&&!cd.autoT&&i>=3&&i<=6)continue;
if(x>=px+bw+6&&x<=px+bw+28&&y>=yy&&y<=yy+bh){
if(P.st[i]<mxSt){P.st[i]++;P.sp--;P.mhp=gMHP(P);P.hp=Mn(P.hp+5,P.mhp);return 1}}}return 0}

// ==================== Sandbox Buttons on Screen ====================
function dSandboxBtns(){
if(mode!=='sandbox'||!P||!P.alive)return;
const bx=16,by=H-285;
// Reset button
X.fillStyle='rgba(255,80,80,.25)';rR(bx,by,85,22,6);X.fill();
X.strokeStyle='rgba(255,80,80,.5)';X.lineWidth=1;rR(bx,by,85,22,6);X.stroke();
X.fillStyle='rgba(255,255,255,.8)';X.font='bold 10px Segoe UI';X.textAlign='center';
X.fillText('🔄 Reset [R]',bx+42,by+15);
// Max button
X.fillStyle='rgba(255,200,0,.25)';rR(bx+92,by,85,22,6);X.fill();
X.strokeStyle='rgba(255,200,0,.5)';X.lineWidth=1;rR(bx+92,by,85,22,6);X.stroke();
X.fillStyle='rgba(255,255,255,.8)';X.fillText('⚡ Max [M]',bx+134,by+15);
X.textAlign='left';
}

function hSandboxBtnClick(x,y){
if(mode!=='sandbox'||!P||!P.alive)return 0;
const bx=16,by=H-285;
if(x>=bx&&x<=bx+85&&y>=by&&y<=by+22){sandboxReset();return 1}
if(x>=bx+92&&x<=bx+177&&y>=by&&y<=by+22){sandboxMax();return 1}
return 0;
}

// ==================== MAIN LOOP ====================
let lastT=0;
function loop(now){
requestAnimationFrame(loop);
const dt=lastT?Mn((now-lastT)/1000,.05):1/60;lastT=now;
if(!playing)return;
fpsCnt++;if(now-fpsT>=1000){fps=fpsCnt;fpsCnt=0;fpsT=now}
fr++;

// UPDATE
updP(dt);
updCam(dt); // Camera updated AFTER player
for(const b of bots)updBot(b,dt);
updDrones(dt);updPhys(dt);spawnS();spawnB();chkCU();

// RENDER
X.fillStyle=COL.bg;X.fillRect(0,0,W,H);
dGrid();dBorder();
[...ents].sort((a,b)=>a.y-b.y).forEach(dShape);
buls.forEach(dBul);
[...bots,P].filter(t=>t&&t.alive).sort((a,b)=>a.y-b.y).forEach(dTank);
dParts();
dStats();dSandboxBtns();dXP();dSc();dMM();dLB();dKF();dNots();dCU();dInd();dFPS();dTab();
}

// ==================== INPUT ====================
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=1;
if(e.key==='Tab'){e.preventDefault();showTab=1}
if(e.key===' '){e.preventDefault();ms2.d=1}
if(!P||!P.alive)return;
const num=parseInt(e.key),cd=CLS[P.cls],mxSt=mode==='sandbox'?99:MS;
if(num>=1&&num<=8&&P.sp>0){const idx=num-1;
if(!(cd.smash&&!cd.autoT&&idx>=3&&idx<=6)&&P.st[idx]<mxSt){
P.st[idx]++;P.sp--;P.mhp=gMHP(P);P.hp=Mn(P.hp+5,P.mhp)}}
const k=e.key.toLowerCase();
if(k==='e')aFire=!aFire;
if(k==='c')aSpin=!aSpin;
if(k==='k'&&mode==='sandbox'){addXP(P,xpF(P.lv));P.sp+=3}
if(k==='o'&&mode==='sandbox')selfK();
if(k==='r'&&mode==='sandbox')sandboxReset();
if(k==='m'&&mode==='sandbox')sandboxMax();
if(k==='shift'&&P.bsCd<=0){P.bsT=45;P.bsCd=300}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;
if(e.key===' ')ms2.d=0;if(e.key==='Tab')showTab=0});
C.addEventListener('mousemove',e=>{ms2.x=e.clientX;ms2.y=e.clientY});
C.addEventListener('mousedown',e=>{ea();ms2.d=1;
if(playing){hCC(e.clientX,e.clientY);hSC(e.clientX,e.clientY);hSandboxBtnClick(e.clientX,e.clientY)}});
C.addEventListener('mouseup',()=>ms2.d=0);
C.addEventListener('contextmenu',e=>e.preventDefault());

// ==================== START ====================
let sM='ffa';
document.querySelectorAll('.mb').forEach(b=>{b.addEventListener('click',()=>{
document.querySelectorAll('.mb').forEach(b2=>b2.classList.remove('ac'));
b.classList.add('ac');sM=b.dataset.mode})});

function start(){const nm=document.getElementById('NI').value.trim()||'Jogador';
mode=sM;document.getElementById('SS').style.display='none';
document.getElementById('DS').style.display='none';
P=mkT(0,0,nm,1);P.inv=120;
ents=[];buls=[];bots=[];pPool=[];nots=[];kFeed=[];
aFire=aSpin=0;showCU=0;cOpts=[];
// Camera starts ON the player (no initial drift)
cam={tx:0,ty:0,x:0,y:0};
shk={x:0,y:0,a:0};fr=0;sWave=0;sTimer=120;showTab=0;sTime=Date.now();
uiXP=0;fps=0;fpsCnt=0;fpsT=performance.now();
if(mode==='sandbox')P.sp=100;
spawnS();spawnB();playing=1}

document.getElementById('PB').addEventListener('click',start);
document.getElementById('NI').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
document.getElementById('RB').addEventListener('click',()=>{document.getElementById('DS').style.display='none';start()});
requestAnimationFrame(loop);
</script>
